# Runs MomExpress with its data kept in a named volume.
#
#   docker compose up -d
#   docker compose exec momexpress npm run users -- add
#
# Put it behind HTTPS (see README) so phones can install it and get notifications.
services:
  momexpress:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - momexpress-data:/data

volumes:
  momexpress-data:
